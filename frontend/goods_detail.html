<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品详情 - 校园易站</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>易</text></svg>">
</head>
<body>
<div class="nav" id="nav"></div>
<div class="container" style="max-width:760px;">
  <h1 class="page-title" id="gTitleNav">商品详情</h1>
  <div class="card" id="detail" style="display:none;">
    <div class="flex-between">
      <h2 id="gTitle"></h2>
      <div id="gStatus"></div>
    </div>
    <div class="g-cover" id="gCover" style="height:220px;font-size:48px;margin:12px 0;"></div>
    <div class="text-danger" style="font-size:30px;font-weight:800;letter-spacing:.5px;" id="gPrice"></div>
    <div class="muted" id="gMeta"></div>
    <div class="desc-text" id="gDesc" style="margin-top:12px;"></div>

    <div id="buyBox" style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">
      <div class="msg" id="msg"></div>
      <div class="grid grid-2">
        <div class="form-row"><label>购买数量</label><input id="qty" type="number" value="1" min="1"></div>
        <div class="form-row"><label>收货联系人</label><input id="contact" placeholder="姓名"></div>
        <div class="form-row"><label>收货手机号（加密存储）</label><input id="phone" placeholder="13800000000"></div>
        <div class="form-row"><label>收货地址</label><input id="address" placeholder="如：3号宿舍楼502"></div>
      </div>
      <div class="form-row"><label>备注</label><input id="remark" placeholder="选填"></div>
      <button class="btn" id="buyBtn" onclick="doBuy()">立即购买（余额支付）</button>
      <span class="muted" style="margin-left:10px;">余额：<span id="myBalance">-</span></span>
    </div>
  </div>
  <div class="card" id="notFound" style="display:none;">商品不存在</div>
</div>
<script src="js/common.js"></script>
<script>
let GID = new URLSearchParams(location.search).get('id');

async function init(){
  try{
    const g = await api('/api/goods/'+GID);
    document.getElementById('detail').style.display = 'block';
    document.getElementById('gTitle').textContent = g.title;
    document.getElementById('gStatus').innerHTML = badge(g.status, STATUS_GOODS);
    document.getElementById('gCover').innerHTML = g.cover ? '<img src="'+esc(g.cover)+'">' : '📦';
    document.getElementById('gPrice').textContent = money(g.price);
    document.getElementById('gMeta').innerHTML = esc(g.category_name) + ' · 卖家：' + esc(g.seller_name)
      + ' · 库存 ' + g.stock + ' · 浏览 ' + g.view_count + ' · ' + fmtTime(g.publish_time);
    document.getElementById('gDesc').textContent = g.description || '（暂无描述）';
    const me = await loadUser();
    if(me){
      document.getElementById('myBalance').textContent = money(me.balance);
      if(me.id === g.seller_id){
        document.getElementById('buyBox').innerHTML = '<div class="muted">这是你发布的商品，不能购买自己发布的商品。</div>';
      }
    } else {
      document.getElementById('buyBox').innerHTML = '<div class="muted"><a href="login.html">登录</a> 后即可购买。</div>';
    }
  }catch(e){
    document.getElementById('notFound').style.display = 'block';
    document.getElementById('notFound').textContent = e.message || '商品不存在或加载失败';
  }
}
async function doBuy(){
  try{
    const me = await requireLogin();
    const body = {
      quantity: parseInt(document.getElementById('qty').value) || 1,
      contact: document.getElementById('contact').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      address: document.getElementById('address').value.trim(),
      remark: document.getElementById('remark').value.trim(),
    };
    if(!body.address){ showMsg('msg','请填写收货地址', false); return; }
    const r = await api('/api/goods/'+GID+'/purchase', {method:'POST', body});
    showMsg('msg', r.msg + '（订单号 ' + r.order_no + '）', true);
    document.getElementById('buyBtn').disabled = true;
    await loadUser();
    document.getElementById('myBalance').textContent = money(CURRENT_USER.balance);
  }catch(e){ showMsg('msg', e.message, false); }
}
renderNav('index.html').then(init);
</script>
</body>
</html>
