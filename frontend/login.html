<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 校园易站</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>易</text></svg>">
</head>
<body>
<div class="nav" id="nav"></div>
<div class="container auth-wrap">
  <div class="auth-head">
    <div class="auth-logo">易</div>
    <h2>欢迎回来</h2>
    <p>登录校园易站，继续你的交易之旅</p>
  </div>
  <div class="card">
    <div class="msg" id="msg"></div>
    <div class="form-row"><label>用户名</label><input id="username" placeholder="用户名 / 手机号"></div>
    <div class="form-row"><label>密码</label><input id="password" type="password" placeholder="请输入密码"></div>
    <button class="btn" style="width:100%;" onclick="doLogin()">登 录</button>
    <div style="margin-top:14px;text-align:center;" class="muted">
      还没有账号？<a href="register.html">立即注册</a>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
async function doLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if(!username || !password){ showMsg('msg','请输入用户名和密码', false); return; }
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username, password})
    });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || ('请求失败(' + res.status + ')'));
    setToken(r.token); localStorage.setItem('user', JSON.stringify(r.user));
    location.href = 'index.html';
  } catch(e){ showMsg('msg', e.message, false); }
}
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
renderNav('login.html');
</script>
</body>
</html>
