<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 校园易站</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>易</text></svg>">
</head>
<body>
<div class="nav" id="nav"></div>
<div class="container auth-wrap">
  <div class="auth-head">
    <div class="auth-logo">易</div>
    <h2>创建账号</h2>
    <p>加入校园易站，开始你的交易之旅</p>
  </div>
  <div class="card">
    <div class="msg" id="msg"></div>
    <div class="form-row"><label>用户名（字母数字下划线，≥3位）</label><input id="username"></div>
    <div class="form-row"><label>密码（≥6位）</label><input id="password" type="password"></div>
    <div class="form-row"><label>昵称</label><input id="nickname"></div>
    <div class="form-row"><label>手机号（选填，加密存储）</label><input id="phone" placeholder="13800000000"></div>
    <button class="btn" style="width:100%;" onclick="doReg()">注 册</button>
    <div style="margin-top:14px;text-align:center;" class="muted">
      已有账号？<a href="login.html">去登录</a>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
async function doReg(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const nickname = document.getElementById('nickname').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if(!username || !password || !nickname){ showMsg('msg','请填写完整', false); return; }
  try {
    const r = await api('/api/auth/register', {method:'POST', body:{username, password, nickname, phone}});
    setToken(r.token); localStorage.setItem('user', JSON.stringify(r.user));
    location.href = 'index.html';
  } catch(e){ showMsg('msg', e.message, false); }
}
renderNav('register.html');
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doReg(); });
</script>
</body>
</html>
