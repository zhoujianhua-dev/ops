<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的订单 - 校园易站</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>易</text></svg>">
</head>
<body>
<div class="nav" id="nav"></div>
<div class="container">
  <h1 class="page-title">我的订单</h1>
  <div class="tabs">
    <button class="active" data-tab="goods" onclick="switchTab('goods')">商品订单（我是买家）</button>
    <button data-tab="sold" onclick="switchTab('sold')">商品订单（我是卖家）</button>
    <button data-tab="parcel" onclick="switchTab('parcel')">我的代拿</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="tab-goods"></div>
  <div id="tab-sold" style="display:none;"></div>
  <div id="tab-parcel" style="display:none;"></div>
</div>
<script src="js/common.js"></script>
<script>
function switchTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-tab="'+t+'"]').classList.add('active');
  ['goods','sold','parcel'].forEach(k=>document.getElementById('tab-'+k).style.display = k===t?'block':'none');
  if(t==='goods') loadGoodsOrders('buyer','tab-goods');
  if(t==='sold') loadGoodsOrders('seller','tab-sold');
  if(t==='parcel') loadParcels();
}
async function init(){
  try{ await requireLogin(); }catch(e){ return; }
  loadGoodsOrders('buyer','tab-goods');
}
async function loadGoodsOrders(role, elId){
  const rows = await api('/api/orders?role='+role);
  const box = document.getElementById(elId);
  if(!rows.length){ box.innerHTML = '<div class="card empty">暂无订单</div>'; return; }
  box.innerHTML = '<div class="card" style="padding:0;"><table><tr><th>订单号</th><th>商品</th><th>'+(role==='seller'?'买家':'卖家')+'</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr>' +
    rows.map(o => '<tr><td>'+o.order_no+'</td>'
      + '<td><a href="goods_detail.html?id='+o.goods_id+'">'+esc(o.goods_title)+'</a> ×'+o.quantity+'</td>'
      + '<td>'+esc(role==='seller'?o.buyer_name:o.seller_name)+'</td>'
      + '<td>'+money(o.total_amount)+'</td><td>'+badge(o.status, STATUS_ORDER)+'</td>'
      + '<td>'+fmtTime(o.created_at)+'</td>'
      + '<td>'
      + (role==='buyer' && o.status===1 ? '<button class="btn btn-sm" onclick="complete('+o.id+')">确认收货</button> <button class="btn btn-danger btn-sm" onclick="cancel('+o.id+')">取消退款</button>' : '')
      + (role==='buyer' && o.status===3 ? '<button class="btn btn-outline btn-sm" onclick="review('+o.id+')">评价</button>' : '')
      + '</td></tr>').join('') + '</table></div>';
}
async function loadParcels(){
  const rows = await api('/api/parcels/mine');
  const box = document.getElementById('tab-parcel');
  if(!rows.length){ box.innerHTML = '<div class="card empty">暂无代拿订单</div>'; return; }
  box.innerHTML = '<div class="card" style="padding:0;"><table><tr><th>订单号</th><th>取件点</th><th>送达地址</th><th>跑腿费</th><th>状态</th><th>接单人</th><th>操作</th></tr>' +
    rows.map(p => '<tr><td>'+p.order_no+'</td><td>'+esc(p.point_name)+'</td><td>'+esc(p.deliver_address)+'</td>'
      + '<td>'+money(p.fee)+'</td><td>'+badge(p.status, STATUS_PARCEL)+'</td><td>'+esc(p.courier_name)+'</td>'
      + '<td>'+(p.status===0?'<button class="btn btn-danger btn-sm" onclick="cancelP('+p.id+')">取消</button>':'')
      + (p.status===3?'<button class="btn btn-outline btn-sm" onclick="reviewP('+p.id+')">评价</button>':'')+'</td></tr>').join('') + '</table></div>';
}
async function complete(oid){
  try{ await api('/api/orders/'+oid+'/complete', {method:'POST'}); showMsg('msg','已确认收货，货款已结算给卖家', true); switchTab('goods'); }catch(e){ showMsg('msg', e.message, false); }
}
async function cancel(oid){
  if(!confirm('确认取消订单？款项将退回余额，库存回补。')) return;
  try{ await api('/api/orders/'+oid+'/cancel', {method:'POST'}); showMsg('msg','已取消退款', true); switchTab('goods'); }catch(e){ showMsg('msg', e.message, false); }
}
async function cancelP(oid){
  if(!confirm('确认取消该代拿？')) return;
  try{ await api('/api/parcels/'+oid+'/cancel', {method:'POST'}); showMsg('msg','已取消', true); switchTab('parcel'); }catch(e){ showMsg('msg', e.message, false); }
}
function review(oid){
  const content = prompt('给本次交易打分（1-5分，输入数字）：','5');
  if(content===null) return;
  submitReview(0, oid, parseInt(content)||5, '');
}
function reviewP(oid){
  const content = prompt('给跑腿者打分（1-5分，输入数字）：','5');
  if(content===null) return;
  submitReview(1, oid, parseInt(content)||5, '');
}
async function submitReview(biz, oid, rating){
  try{
    await api('/api/reviews', {method:'POST', body:{biz_type:biz, order_id:oid, rating, content:''}});
    showMsg('msg','评价成功', true);
  }catch(e){ showMsg('msg', e.message, false); }
}
renderNav('my_orders.html').then(init);
</script>
</body>
</html>
